version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: teampl-db
    restart: always
    environment:
      POSTGRES_USER: teampl_user
      POSTGRES_PASSWORD: teampl_password
      POSTGRES_DB: teampl_db
    ports:
      - '5432:5432'
    volumes:
      - teampl_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./teampl-back
      dockerfile: Dockerfile.dev
    container_name: teampl-backend
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=postgresql://teampl_user:teampl_password@db:5432/teampl_db?schema=public
      - JWT_SECRET=fallback-secret-key
      - CHOKIDAR_USEPOLLING=true
      - MS_CLIENT_ID=${MS_CLIENT_ID}
      - MS_CLIENT_SECRET=${MS_CLIENT_SECRET}
      - MS_REDIRECT_URI=${MS_REDIRECT_URI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./teampl-back:/app
      - /app/node_modules
    depends_on:
      - db
    # 컨테이너 구동 시 Prisma 스키마를 DB에 반영하고 최신 클라이언트를 생성합니다. (익명 볼륨 캐싱 문제 해결)
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed && npm run dev"

  frontend:
    build:
      context: ./teampl
      dockerfile: Dockerfile.dev
    container_name: teampl-frontend
    ports:
      - '5173:5173'
    environment:
      # 윈도우 환경 호스트 볼륨 핫리로딩 호환 옵션
      - CHOKIDAR_USEPOLLING=true 
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./teampl:/app
      - /app/node_modules
    depends_on:
      - backend
    # 외부 접속 허용 및 캐시 초기화(--force) 개발 서버 구동
    command: sh -c "npm config set strict-ssl false && npm install && npm run dev -- --host 0.0.0.0 --force"

volumes:
  teampl_pgdata:
