<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>네트워크 연결 확인 - Teampl</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #09111f;
      --card-bg: rgba(21, 28, 49, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-sub: #7d879c;
      --primary: #11b886;
      --primary-hover: #0ea271;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 50%, #15223e 0%, var(--bg-color) 100%);
      color: var(--text-main);
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .glow {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: var(--primary);
      filter: blur(120px);
      opacity: 0.12;
      z-index: 1;
      top: 20%;
      left: 30%;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      z-index: 2;
      animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: rgba(17, 184, 134, 0.1);
      border: 1px solid rgba(17, 184, 134, 0.2);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      color: var(--primary);
      box-shadow: inset 0 0 15px rgba(17, 184, 134, 0.05);
    }

    .icon-wrapper svg {
      width: 38px;
      height: 38px;
      stroke-width: 2;
      animation: pulse 2.5s infinite ease-in-out;
    }

    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #dcdfe6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 32px;
      word-break: keep-all;
    }

    .retry-btn {
      width: 100%;
      padding: 16px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 8px 24px rgba(17, 184, 134, 0.25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .retry-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(17, 184, 134, 0.35);
    }

    .retry-btn:active {
      transform: translateY(0);
      background: #0c8c63;
    }

    .logo-footer {
      margin-top: 36px;
      opacity: 0.25;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .logo-footer img {
      width: 24px;
      height: 24px;
    }

    .logo-footer span {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.65;
        transform: scale(0.95);
      }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </div>
    <h1>네트워크 연결이 끊겼습니다</h1>
    <p>Teampl 서비스를 이용하시려면 안정적인 인터넷 연결이 필요합니다. 네트워크 상태를 확인하시고 아래 새로고침 버튼을 눌러주세요.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      다시 연결 시도
    </button>
    <div class="logo-footer">
      <img src="/logo.png" alt="Teampl Logo" onerror="this.style.display='none'">
      <span>Teampl</span>
    </div>
  </div>
</body>
</html>
